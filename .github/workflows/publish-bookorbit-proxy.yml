name: Build and Publish BookOrbit Proxy

on:
push:
branches:
- main
paths:
- "bookorbit-proxy/**"
- ".github/workflows/publish-bookorbit-proxy.yml"
workflow_dispatch:

jobs:
build-and-push:
runs-on: ubuntu-latest

permissions:
  contents: read
  packages: write

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Log in to GHCR
    uses: docker/login-action@v3
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  - name: Build and push
    uses: docker/build-push-action@v6
    with:
      context: ./bookorbit-proxy
      push: true
      tags: |
        ghcr.io/hello2ashu/bookorbit-proxy:latest
        ghcr.io/hello2ashu/bookorbit-proxy:sha-${{ github.sha }}
